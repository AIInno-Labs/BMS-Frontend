# Hygiene checks on pull requests into milestone* / del-*. Does not deploy.
#
# API: https://frp-684387770054.asia-south1.run.app/api/v1
name: Checks

on:
  pull_request:
    branches:
      - "milestone*"
      - "del-*"

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_FRP_API_BASE_URL: https://frp-684387770054.asia-south1.run.app/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
